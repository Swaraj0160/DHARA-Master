<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" fill="none" stroke="#d4af37" stroke-width="1.2">
  <circle cx="100" cy="100" r="95" stroke-dasharray="2,3" stroke-width="0.8"/>
  <circle cx="100" cy="100" r="90" stroke-width="1.5"/>
  <circle cx="100" cy="100" r="82" stroke-dasharray="4,4"/>
  <circle cx="100" cy="100" r="70"/>
  <circle cx="100" cy="100" r="56"/>
  <circle cx="100" cy="100" r="42"/>
  <circle cx="100" cy="100" r="28"/>
  <circle cx="100" cy="100" r="14" fill="#d4af37" fill-opacity="0.15"/>
  
  <!-- 8-fold lotus petals / star geometry -->
  <g transform="translate(100,100)">
    <path d="M0 -70 C15 -50 15 -30 0 -14 C-15 -30 -15 -50 0 -70 Z" fill="#d4af37" fill-opacity="0.08"/>
    <path d="M0 -70 C15 -50 15 -30 0 -14 C-15 -30 -15 -50 0 -70 Z" transform="rotate(45)" fill="#d4af37" fill-opacity="0.08"/>
    <path d="M0 -70 C15 -50 15 -30 0 -14 C-15 -30 -15 -50 0 -70 Z" transform="rotate(90)" fill="#d4af37" fill-opacity="0.08"/>
    <path d="M0 -70 C15 -50 15 -30 0 -14 C-15 -30 -15 -50 0 -70 Z" transform="rotate(135)" fill="#d4af37" fill-opacity="0.08"/>
    <path d="M0 -70 C15 -50 15 -30 0 -14 C-15 -30 -15 -50 0 -70 Z" transform="rotate(180)" fill="#d4af37" fill-opacity="0.08"/>
    <path d="M0 -70 C15 -50 15 -30 0 -14 C-15 -30 -15 -50 0 -70 Z" transform="rotate(225)" fill="#d4af37" fill-opacity="0.08"/>
    <path d="M0 -70 C15 -50 15 -30 0 -14 C-15 -30 -15 -50 0 -70 Z" transform="rotate(270)" fill="#d4af37" fill-opacity="0.08"/>
    <path d="M0 -70 C15 -50 15 -30 0 -14 C-15 -30 -15 -50 0 -70 Z" transform="rotate(315)" fill="#d4af37" fill-opacity="0.08"/>
    
    <!-- Inner 16-point geometric stars -->
    <polygon points="0,-42 11,-26 29,-29 20,-13 36,0 20,13 29,29 11,26 0,42 -11,26 -29,29 -20,13 -36,0 -20,-13 -29,-29 -11,-26" stroke-width="0.7"/>
    <circle cx="0" cy="0" r="4" fill="#d4af37"/>
  </g>
</svg>
