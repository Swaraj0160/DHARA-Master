<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <defs>
    <radialGradient id="vedaGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#faeb9e" stop-opacity="0.8"/>
      <stop offset="60%" stop-color="#d4af37" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#190e09" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fff8db"/>
      <stop offset="50%" stop-color="#d4af37"/>
      <stop offset="100%" stop-color="#885b1a"/>
    </linearGradient>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#2c1a12"/>
      <stop offset="100%" stop-color="#120a06"/>
    </linearGradient>
  </defs>

  <!-- Background Base Circle -->
  <circle cx="100" cy="100" r="92" fill="url(#bgGrad)" stroke="url(#goldGrad)" stroke-width="4"/>
  <circle cx="100" cy="100" r="84" fill="url(#vedaGlow)"/>

  <!-- Ancient Ornamental Ring -->
  <circle cx="100" cy="100" r="76" fill="none" stroke="#d4af37" stroke-width="1.5" stroke-dasharray="4,6" opacity="0.75"/>
  <circle cx="100" cy="100" r="68" fill="none" stroke="#faeb9e" stroke-width="1" opacity="0.4"/>

  <!-- 8-Pointed Star Motif -->
  <g stroke="url(#goldGrad)" stroke-width="2" fill="none" opacity="0.6">
    <polygon points="100,28 116,84 172,100 116,116 100,172 84,116 28,100 84,84"/>
  </g>

  <!-- Lotus Base / Petals -->
  <path d="M70,140 Q100,120 130,140 Q100,165 70,140 Z" fill="#d4af37" opacity="0.3"/>
  <path d="M80,135 Q100,118 120,135 Q100,150 80,135 Z" fill="#faeb9e" opacity="0.5"/>

  <!-- Stylized Scholar Diadem / Crown / Third Eye Flame -->
  <path d="M100,52 C94,66 90,74 100,84 C110,74 106,66 100,52 Z" fill="url(#goldGrad)"/>
  <circle cx="100" cy="72" r="3" fill="#fffdf9"/>

  <!-- "VEDA" Monogram Character Emblem -->
  <text x="100" y="118" font-family="'Cinzel', 'Playfair Display', Georgia, serif" font-size="28" font-weight="bold" fill="url(#goldGrad)" text-anchor="middle" letter-spacing="2">
    VEDA
  </text>
  <text x="100" y="132" font-family="monospace" font-size="9" fill="#faeb9e" text-anchor="middle" letter-spacing="3" opacity="0.8">
    CHRONO GUIDE
  </text>
</svg>
